name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noninteractive-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only noninteractive test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pillow>=10.0" pytest
      - name: Run solver, probability, vision, UI, and humanize tests
        run: python -m pytest -q tests
